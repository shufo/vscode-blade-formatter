name: E2E Test
on: [push]
jobs:
  test:
    name: E2E Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode_version: ["1.140.0", "1.142.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Make envfile
        run: |
          echo APP_INSIGHT_INSTRUMENT_KEY=example_key >> .env
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"
      - uses: actions/cache@v6
        id: vscode-test-cache
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test-${{ matrix.vscode_version }}
      - name: Install dependencies
        run: npm ci

      - name: Run headless test on Linux
        uses: GabrielBB/xvfb-action@v1.7
        if: runner.os == 'Linux'
        with:
          run: npm run test:e2e
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
          TMP_DIR: ${{ runner.temp }}

      - name: Run headless test
        if: runner.os != 'Linux'
        run: npm run test:e2e
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
          TMP_DIR: ${{ runner.temp }}

      - uses: actions/upload-artifact@v7
        with:
          name: packged vsix
          path: ${{ runner.temp }}/*.vsix
