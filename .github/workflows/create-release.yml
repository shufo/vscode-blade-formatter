on:
  push:
    branches:
      - main
name: create-release
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: GoogleCloudPlatform/release-please-action@v4
        id: release
      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
      - name: Make envfile
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo APP_INSIGHT_INSTRUMENT_KEY=${{ secrets.APP_INSIGHT_INSTRUMENT_KEY }} >> .env
      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}
      - run: npm run compile
        if: ${{ steps.release.outputs.release_created }}
      - run: npx vsce package --allow-package-env-file -o artifact.vsix
        if: ${{ steps.release.outputs.release_created }}
      - run: npx vsce publish -p $VSCE_TOKEN -i artifact.vsix
        if: ${{ steps.release.outputs.release_created }}
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
      - run: npm install -g ovsx
        if: ${{ steps.release.outputs.release_created }}
      - run: ovsx publish -p $OVSX_TOKEN -i artifact.vsix
        if: ${{ steps.release.outputs.release_created }}
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

      - name: Upload Release Artifact
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv artifact.vsix vscode-blade-formatter-${{ steps.release.outputs.version }}.vsix && \
          gh release upload ${{ steps.release.outputs.tag_name }} vscode-blade-formatter-${{ steps.release.outputs.version }}.vsix
